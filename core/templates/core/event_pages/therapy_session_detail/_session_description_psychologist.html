<!-- БЛОК 5: Подключение и добавление доп описания от специалиста во встрече -->

<article class="rounded-[2rem] bg-slate-100/50 p-6 sm:p-8 shadow-lg shadow-slate-100 backdrop-blur-md animate-fade-in-up delay-200">
    <h2 class="text-2xl font-extrabold text-indigo-950 mb-6">
        Описание события
    </h2>

    <form method="post" class="space-y-4 glass-input">
        {% csrf_token %}
        <input type="hidden" name="action" value="save_event_description">
        {{ form.event_description }}
        <button type="submit"
                class="cta-shine-button group w-full sm:w-auto inline-flex items-center justify-center px-6 py-3 gap-3 rounded-xl bg-indigo-700
                text-white font-bold transition-all duration-200 hover:bg-indigo-800 border border-transparent">
            <span class="cta-shine-button__glint"></span>
            <span class="relative z-10">Сохранить описание</span>
        </button>
    </form>
</article>
